# Local convenience only; CI runs the same checks (npm run verify, terraform fmt) itself.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,json,md}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: terraform-fmt
      glob: "*.{tf,tftest.hcl}"
      run: terraform fmt {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: verify
      run: npm run verify
