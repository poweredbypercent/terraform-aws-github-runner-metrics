name: Release

# Pushing a tag vX.Y.Z (matching package.json's version, on main) builds the Lambda zip, attests
# its build provenance, and publishes a GitHub release with the zip and its SHA-256. There are no
# floating vX / vX.Y tags: consumers pin vX.Y.Z, and the workflow never writes a tag, so the
# built-in token is enough and the tag ruleset needs no bypass for automation.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # The documented local-workflow form; zizmor's suggested "$/" syntax is newer than many readers.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::${TAG} is not on main"; exit 1; }
          version="v$(jq -r .version package.json)"
          [ "${version}" = "${TAG%%-*}" ] || { echo "::error::${TAG} does not match package.json ${version}"; exit 1; }
      # No dependency cache in a release build: a poisoned cache would ship in the artifact.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: zip
        run: |
          npm run --silent zip
          echo "sha256=$(cut -d' ' -f1 dist/terraform-aws-github-runner-metrics.zip.sha256)" >>"${GITHUB_OUTPUT}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/terraform-aws-github-runner-metrics.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/terraform-aws-github-runner-metrics.zip
            dist/terraform-aws-github-runner-metrics.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A protected environment: required reviewers approve each release (see CONTRIBUTING.md).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets
      - name: Publish the release
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body >notes.md
          cat >>notes.md <<EOF

          ## Install

          \`\`\`hcl
          module "metrics_lambda" {
            source      = "github.com/${GITHUB_REPOSITORY}//modules/download-lambda?ref=${TAG}"
            release_tag = "${TAG}"
            sha256      = "${SHA256}"
          }
          \`\`\`

          ## Verify

          \`\`\`
          sha256sum -c terraform-aws-github-runner-metrics.zip.sha256
          gh attestation verify terraform-aws-github-runner-metrics.zip --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml \\
            --source-ref refs/tags/${TAG} --deny-self-hosted-runners
          \`\`\`
          EOF
          prerelease=""
          [[ "${TAG}" == *-* ]] && prerelease="--prerelease"
          # Draft first and publish once every asset is attached, so the release is complete the
          # moment it appears (and works with immutable releases).
          gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --notes-file notes.md ${prerelease} assets/*
          gh release edit "${TAG}" --draft=false
