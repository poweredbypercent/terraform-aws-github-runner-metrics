name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node ${{ matrix.node }} - lint, types, unit tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Lambda runtimes the module offers (lambda_runtime); the release bundle targets 22.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bats
      - name: Metric docs are up to date
        run: |
          npm run --silent docs:metrics
          git diff --exit-code -- docs/metrics.md || { echo "::error::docs/metrics.md is stale: run npm run docs:metrics"; exit 1; }
      - name: The bundle builds reproducibly
        run: |
          npm run --silent zip
          cp dist/terraform-aws-github-runner-metrics.zip.sha256 /tmp/first.sha256
          rm -rf dist
          npm run --silent zip
          diff /tmp/first.sha256 dist/terraform-aws-github-runner-metrics.zip.sha256

  e2e:
    name: Node ${{ matrix.node }} - remote write to a real Prometheus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/e2e.sh

  terraform-validate:
    name: Terraform ${{ matrix.terraform }}, AWS provider ${{ matrix.aws }}.x - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Terraform the module claims (required_version >= 1.5) and the newest; both
        # AWS provider majors runner stacks are on (terraform-aws-github-runner v6: 5.x, v7: 6.x).
        terraform: ['1.5.7', 'latest']
        aws: ['5', '6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Pin the AWS provider major
        env:
          AWS_MAJOR: ${{ matrix.aws }}
        run: |
          constraint=$([ "${AWS_MAJOR}" = 5 ] && echo '~> 5.77' || echo '~> 6.0')
          printf 'terraform {\n  required_providers {\n    aws = { source = "hashicorp/aws", version = "%s" }\n  }\n}\n' "${constraint}" >ci_aws_provider.tf
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform -chdir=modules/download-lambda init -backend=false -input=false && terraform -chdir=modules/download-lambda validate

  terraform-test:
    name: Terraform ${{ matrix.terraform }}, AWS provider ${{ matrix.aws }}.x - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The tests use plan-time overrides, which need Terraform 1.11.
        terraform: ['1.11.4', 'latest']
        aws: ['5', '6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Pin the AWS provider major
        env:
          AWS_MAJOR: ${{ matrix.aws }}
        run: |
          constraint=$([ "${AWS_MAJOR}" = 5 ] && echo '~> 5.77' || echo '~> 6.0')
          printf 'terraform {\n  required_providers {\n    aws = { source = "hashicorp/aws", version = "%s" }\n  }\n}\n' "${constraint}" >ci_aws_provider.tf
      - run: terraform init -backend=false -input=false
      - run: terraform test

  examples:
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [multi-runner-amp, single-runner-grafana-cloud]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform -chdir="examples/${{ matrix.example }}" init -backend=false -input=false
      - run: terraform -chdir="examples/${{ matrix.example }}" validate
      - run: tflint --init && tflint --chdir="examples/${{ matrix.example }}" --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lint:
    name: tflint and terraform-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform init -backend=false -input=false
      - run: tflint --init && tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .,modules/download-lambda
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  # The one check to require in branch protection: renaming or adding a job above cannot quietly
  # leave main unprotected.
  ci-ok:
    if: always()
    needs: [node, e2e, terraform-validate, terraform-test, examples, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            [ "${result}" = success ] || { echo "::error::a CI job ended ${result}"; exit 1; }
          done
